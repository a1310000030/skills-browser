<script>
let mode = 'solo';
let selected = new Set();

// Mode switch
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    mode = this.dataset.mode;
    if (mode === 'team') {
      document.body.classList.add('team-mode');
      document.querySelectorAll('.section-select-all').forEach(s => s.style.display = '');
      document.querySelectorAll('.card .copy-hint').forEach(h => h.textContent = '鐐瑰嚮閫夋嫨');
    } else {
      document.body.classList.remove('team-mode');
      document.querySelectorAll('.section-select-all').forEach(s => s.style.display = 'none');
      document.querySelectorAll('.card .copy-hint').forEach(h => h.textContent = '鐐瑰嚮澶嶅埗');
      clearTeam();
    }
  });
});

// Card click handler
function handleCardClick(card, event) {
  if (mode === 'team') {
    toggleCard(card);
  } else {
    copySingleSkill(card);
  }
}

// Solo mode: copy
function copySingleSkill(card) {
  const cmd = card.dataset.cmd;
  navigator.clipboard.writeText(cmd).then(() => {
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 1500);
  });
}

// Team mode: toggle
function toggleCard(card) {
  const slug = card.dataset.slug;
  if (selected.has(slug)) {
    selected.delete(slug);
    card.classList.remove('selected');
  } else {
    selected.add(slug);
    card.classList.add('selected');
  }
  updateTeamPanel();
}

// Select all in section
function selectSection(cat) {
  if (mode !== 'team') return;
  const cards = document.querySelectorAll(`.card[data-cat="${cat}"]`);
  const allSelected = [...cards].every(c => selected.has(c.dataset.slug));
  cards.forEach(card => {
    if (allSelected) {
      selected.delete(card.dataset.slug);
      card.classList.remove('selected');
    } else {
      selected.add(card.dataset.slug);
      card.classList.add('selected');
    }
  });
  updateTeamPanel();
}

// Update team panel
function updateTeamPanel() {
  const panel = document.getElementById('teamPanel');
  const count = document.getElementById('teamCount');
  const tags = document.getElementById('teamTags');
  const statNum = document.querySelector('#teamStat .num');
  
  count.textContent = selected.size;
  statNum.textContent = selected.size;
  
  tags.innerHTML = '';
  selected.forEach(slug => {
    const card = document.querySelector(`.card[data-slug="${slug}"]`);
    const title = card ? card.dataset.title : slug;
    const tag = document.createElement('span');
    tag.className = 'team-tag';
    tag.innerHTML = `${title} <span class="remove" onclick="event.stopPropagation();removeFromTeam('${slug}')">脳</span>`;
    tags.appendChild(tag);
  });
  
  if (selected.size > 0) {
    panel.classList.add('show');
  } else {
    panel.classList.remove('show');
  }
}

// Remove one
function removeFromTeam(slug) {
  selected.delete(slug);
  const card = document.querySelector(`.card[data-slug="${slug}"]`);
  if (card) card.classList.remove('selected');
  updateTeamPanel();
}

// Clear all
function clearTeam() {
  selected.clear();
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  updateTeamPanel();
}

// Open modal
function openModal() {
  if (selected.size === 0) return;
  
  // Build team list
  const modalList = document.getElementById('modalTeamList');
  modalList.innerHTML = '';
  selected.forEach(slug => {
    const card = document.querySelector(`.card[data-slug="${slug}"]`);
    const title = card ? card.dataset.title : slug;
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = title;
    modalList.appendChild(pill);
  });
  
  generatePrompt();
  document.getElementById('modalOverlay').classList.add('show');
  
  // Listen for task input changes
  document.getElementById('taskInput').addEventListener('input', generatePrompt);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// Generate prompt
function generatePrompt() {
  const task = document.getElementById('taskInput').value.trim();
  let prompt = '';
  
  if (selected.size === 1 || (task === '' && selected.size > 0)) {
    // Solo or team without specific task - concise version
    const titles = [];
    selected.forEach(slug => {
      const card = document.querySelector(`.card[data-slug="${slug}"]`);
      titles.push(card ? card.dataset.title : slug);
    });
    
    if (selected.size === 1) {
      prompt = `鐢?{titles[0]}甯垜...`;
    } else {
      prompt = `鎴戦渶瑕佷竴涓笓瀹跺洟闃熷崗浣滐細

`;
      let i = 1;
      selected.forEach(slug => {
        const card = document.querySelector(`.card[data-slug="${slug}"]`);
        const title = card ? card.dataset.title : slug;
        const desc = card ? card.querySelector('.desc').textContent : '';
        prompt += `${i}. ${title} 鈥?${desc}
`;
        i++;
      });
      prompt += `
璇峰悇浣嶄笓瀹朵粠鍚勮嚜涓撲笟瑙掑害鍗忓悓瀹屾垚浠诲姟銆俙;
    }
  } else {
    // Full team mode with task
    prompt = `鎴戦渶瑕佷竴涓笓瀹跺洟闃熷崗浣滃畬鎴愪互涓嬩换鍔★細

`;
    prompt += `銆愭垜鐨勯渶姹傘€?
${task}

`;
    prompt += `銆愪笓瀹跺洟闃熴€?
`;
    let i = 1;
    selected.forEach(slug => {
      const card = document.querySelector(`.card[data-slug="${slug}"]`);
      const title = card ? card.dataset.title : slug;
      const desc = card ? card.querySelector('.desc').textContent : '';
      prompt += `${i}. ${title} 鈥?${desc}
`;
      i++;
    });
    prompt += `
璇峰悇浣嶄笓瀹朵粠鍚勮嚜涓撲笟瑙掑害缁欏嚭寤鸿锛屾暣鍚堟垚涓€浠藉彲鎵ц鐨勬柟妗堛€俙;
  }
  
  document.getElementById('generatedPrompt').textContent = prompt;
}

// Copy prompt
function copyPrompt() {
  const prompt = document.getElementById('generatedPrompt').textContent;
  navigator.clipboard.writeText(prompt).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '鉁?宸插鍒?';
    setTimeout(() => { btn.textContent = '馃搵 澶嶅埗鎸囦护'; }, 2000);
  });
}

// Search
document.getElementById('search').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    const txt = (c.dataset.slug + ' ' + c.dataset.title + ' ' + c.querySelector('.desc').textContent).toLowerCase();
    c.style.display = txt.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.section-title').forEach(s => {
    const grid = s.nextElementSibling;
    if (!grid || !grid.classList.contains('grid')) return;
    const visible = [...grid.querySelectorAll('.card')].some(c => c.style.display !== 'none');
    s.style.display = visible ? '' : 'none';
  });
  document.getElementById('no-results').style.display = 
    [...document.querySelectorAll('.card')].every(c => c.style.display === 'none') ? 'block' : 'none';
});

// Category filter
document.querySelectorAll('.cat-item').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
    this.classList.add('active');
    const cat = this.dataset.cat;
    document.querySelectorAll('.section-title').forEach(s => {
      const shouldShow = (cat === 'all' || s.dataset.section === cat);
      s.style.display = shouldShow ? '' : 'none';
      // Also hide/show the grid that follows this section title
      const grid = s.nextElementSibling;
      if (grid && grid.classList.contains('grid')) {
        grid.style.display = shouldShow ? '' : 'none';
      }
    });
    // Reset search box when switching categories
    document.getElementById('search').value = '';
    document.getElementById('no-results').style.display = 'none';
    // Update total count in stats
    if (cat === 'all') {
      document.getElementById('totalCount').textContent = '221';
    } else {
      const visibleCards = document.querySelectorAll('.card[data-cat="' + cat + '"]');
      document.getElementById('totalCount').textContent = visibleCards.length;
    }
  });
});

// Back to top
window.addEventListener('scroll', () => {
  document.querySelector('.back-top').classList.toggle('show', window.scrollY > 400);
});

// Keyboard shortcut: T to toggle mode
document.addEventListener('keydown', function(e) {
  if (e.key === 't' && e.ctrlKey) {
    e.preventDefault();
    const teamBtn = document.querySelector('.mode-btn[data-mode="team"]');
    const soloBtn = document.querySelector('.mode-btn[data-mode="solo"]');
    if (mode === 'solo') { teamBtn.click(); } else { soloBtn.click(); }
  }
});
</script>
